name: Check Makerbook fork scope

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  fork-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install pinned dependencies
        run: yarn install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0

      - name: Test the production authorization predicate and retained ABI
        run: cargo test --locked -p manifest-dex --lib

      - name: Verify narrow program diff and mechanical ABI client binding
        run: ./scripts/verify-makerbook-program-scope.sh
